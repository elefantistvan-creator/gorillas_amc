name: Android build (Gorillas AMC)
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }
      - name: Build debug APK (phone test) and unsigned release bundle (Play)
        working-directory: android
        run: gradle --no-daemon assembleDebug bundleRelease
      - name: Publish the results on the android-build branch
        run: |
          mkdir -p /tmp/out
          cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/gorillas-amc-debug.apk
          cp android/app/build/outputs/bundle/release/app-release.aab /tmp/out/gorillas-amc-release-unsigned.aab
          echo "${GITHUB_SHA}" > /tmp/out/SOURCE_COMMIT
          cd /tmp/out
          git init -q -b android-build
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add . && git commit -qm "Android build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-build
